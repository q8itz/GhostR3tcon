# HUD sprite blend modes in sub_821B8FF8. The bctr at 0x821B91DC indexes this
# table with r7 (the signed blend-mode byte). Codegen switched on r8, which is
# 0 here, so every sprite took SrcAlpha/InvSrcAlpha and the frame painted black.
[[switch_tables]]
address = 0x821B91DC
register = 7
labels = [
  0x821B924C, 0x821B9248, 0x821B9258, 0x821B9264, 0x821B9274, 0x821B9284,
